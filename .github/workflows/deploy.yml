name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 國發會大約每月 27 號公布景氣燈號，月底到月初每天早上 10 點（台灣時間）重新抓一次
  schedule:
    - cron: '0 2 1-3,25-31 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 更新國發會景氣燈號
        run: python3 scripts/update_ndc.py || echo "::warning::景氣燈號沒抓到，沿用上次的資料"
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
